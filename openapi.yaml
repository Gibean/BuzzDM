openapi: 3.0.0
info:
  title: 'BuzzDM API'
  description: 'API documentation for BuzzDM System'
  version: 1.0.0
servers:
  -
    url: 'http://localhost/BuzzDM'
    description: 'Local Development Server'
  -
    url: 'https://buzzdatamanager.com'
    description: 'Production Server (Hostinger)'
paths:
  /php/api_auth.php:
    post:
      tags:
        - Auth
      summary: 'Authentication Actions'
      description: "Login, Logout, Forgot Password, Reset Password via 'action' param"
      operationId: 25fece8acb463af16d2a9159879e81f8
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [login, logout, forgot_password, reset_password]
                email:
                  description: 'For login/forgot'
                  type: string
                password:
                  description: 'For login/reset'
                  type: string
                confirmPassword:
                  description: 'For reset'
                  type: string
                token:
                  description: 'For reset'
                  type: string
              type: object
      responses:
        '200':
          description: 'Action result'
  /php/api_backups.php:
    get:
      tags:
        - Backups
      summary: 'List backups'
      operationId: 167c48e6290c4b580657d2af59e8776a
      responses:
        '200':
          description: 'Backup list'
    delete:
      tags:
        - Backups
      summary: 'Delete backup'
      operationId: 73b53df78ca0ad0bbb626b4c995a1de3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                id:
                  type: integer
              type: object
      responses:
        '200':
          description: 'Backup deleted'
  '/php/api_backups.php?action=create':
    post:
      tags:
        - Backups
      summary: 'Create backup'
      operationId: e410090d7e85c2ed394a0cf634c4eeb6
      responses:
        '200':
          description: 'Backup created'
  '/php/api_backups.php?action=restore':
    post:
      tags:
        - Backups
      summary: 'Restore backup'
      operationId: f1c2af3cce6045b454553967ee73d885
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                id:
                  type: integer
              type: object
      responses:
        '200':
          description: 'Backup restored'
  '/php/api_backups.php?action=download':
    get:
      tags:
        - Backups
      summary: 'Download backup'
      operationId: b6df29e8c103e09c72237bd8ddd1ee53
      parameters:
        -
          name: id
          in: query
          description: 'Backup ID'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'File download'
          content:
            application/octet-stream: {  }
  '/php/api_backups.php?action=status':
    get:
      tags:
        - Backups
      summary: 'Get backup status'
      operationId: 74b5d09740e920d786e4d167ab9e5a9c
      responses:
        '200':
          description: Status
  '/php/api_backups.php?action=toggle_fallback':
    post:
      tags:
        - Backups
      summary: 'Toggle fallback backup'
      operationId: 6ea20faa73c02a359122c7dae3dd7d03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                enabled:
                  type: boolean
              type: object
      responses:
        '200':
          description: Toggled
  /php/api_cargos.php:
    get:
      tags:
        - Cargos
      summary: 'List cargos or get cargo'
      operationId: 3747b5fc0b09d1e634ff19cad4bac6e7
      parameters:
        -
          name: id
          in: query
          description: 'Cargo ID'
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 'Cargo data'
    put:
      tags:
        - Cargos
      summary: 'Update cargo'
      operationId: cd556bb995629c35bacfc563b51f2db8
      parameters:
        -
          name: id
          in: query
          description: 'Cargo ID'
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Cargo updated'
    post:
      tags:
        - Cargos
      summary: 'Create or act on cargo'
      operationId: 4d68a9db55071ada4381f83914970c09
      parameters:
        -
          name: action
          in: query
          description: 'Action (create/confirm/cancel)'
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Cargo created or updated'
    delete:
      tags:
        - Cargos
      summary: 'Delete cargo'
      operationId: 19e1fd2926a43dc939a431d654625443
      parameters:
        -
          name: id
          in: query
          description: 'Cargo ID'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Cargo deleted'
  /php/api_catalogs.php:
    get:
      tags:
        - Catalogs
      summary: 'Get catalogs or items'
      operationId: 81d2f56c8e7a3f6741588e9c5b6b56df
      parameters:
        -
          name: type
          in: query
          description: 'Type (resumen)'
          required: false
          schema:
            type: string
        -
          name: catalog
          in: query
          description: 'Strict catalog name'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 'Catalog data'
    put:
      tags:
        - Catalogs
      summary: 'Update catalog item'
      operationId: e408098a82a74e9fc8e89a7e854addde
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Item updated'
    post:
      tags:
        - Catalogs
      summary: 'Create catalog item'
      operationId: ec823476e8735f18ca8c793ae0434bcc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Item created'
    delete:
      tags:
        - Catalogs
      summary: 'Delete catalog item'
      operationId: 542c59bec378fba6097b871d545ce27e
      parameters:
        -
          name: catalog
          in: query
          description: 'Catalog name'
          required: true
          schema:
            type: string
        -
          name: id
          in: query
          description: 'Item ID'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Item deleted'
  /php/api_clientes.php:
    get:
      tags:
        - Clients
      summary: 'List or get clients'
      operationId: 09d0b93d3b6f36f667c1ca9fc6583434
      parameters:
        -
          name: id
          in: query
          description: 'Client ID'
          required: false
          schema:
            type: integer
        -
          name: action
          in: query
          description: "Action (e.g., 'frequent')"
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 'Client list or details'
    put:
      tags:
        - Clients
      summary: 'Update a client'
      operationId: ae870e6fce00ec2fa627ca2c607f3fd1
      parameters:
        -
          name: id
          in: query
          description: 'Client ID'
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                cedula:
                  type: string
                  example: V-12345678
                nombre:
                  type: string
                  example: 'Juan Pérez Actualizado'
                email:
                  type: string
                  example: juan.nuevo@email.com
                telefono:
                  type: string
                  example: 0412-9999999
                direccion:
                  type: string
                  example: 'Nueva dirección'
                vip:
                  type: boolean
                  example: true
              type: object
            example:
              nombre: 'Juan Pérez Actualizado'
              email: juan.nuevo@email.com
              vip: true
      responses:
        '200':
          description: 'Client updated'
    post:
      tags:
        - Clients
      summary: 'Create a new client'
      operationId: 897024c38fd012c8f056f4ec27df7241
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - nombre
              properties:
                cedula:
                  description: 'ID document (Cédula/RIF)'
                  type: string
                  example: V-12345678
                nombre:
                  description: 'Full name or company name'
                  type: string
                  example: 'Juan Pérez'
                email:
                  description: 'Email address'
                  type: string
                  format: email
                  example: juan@email.com
                telefono:
                  description: 'Phone number'
                  type: string
                  example: 0414-1234567
                direccion:
                  description: Address
                  type: string
                  example: 'Av. Principal #123, Caracas'
                vip:
                  description: 'VIP customer flag'
                  type: boolean
                  example: false
              type: object
            example:
              cedula: V-12345678
              nombre: 'Juan Pérez'
              email: juan@email.com
              telefono: 0414-1234567
              direccion: 'Av. Principal #123, Caracas'
              vip: false
      responses:
        '200':
          description: 'Client created'
    delete:
      tags:
        - Clients
      summary: 'Delete a client'
      operationId: e37f80920ef02dbaad1c05c8cebb9a07
      parameters:
        -
          name: id
          in: query
          description: 'Client ID'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Client deleted'
  /php/api_import.php:
    get:
      tags:
        - Import
      summary: 'Get import history'
      operationId: 890bed880536b6aac4d75b24bd7ef9a3
      responses:
        '200':
          description: 'History list'
    post:
      tags:
        - Import
      summary: 'Process excel import'
      operationId: 615737a611446dc315f4c9702727c122
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - import_file
              properties:
                import_file:
                  description: 'Excel file to import'
                  type: string
                  format: binary
              type: object
      responses:
        '200':
          description: 'Import result'
  /php/api_kits.php:
    get:
      tags:
        - Kits
      summary: 'Get kit components'
      operationId: d7d04da7a9a788a4044c1b01de5e94f7
      parameters:
        -
          name: kit_id
          in: query
          description: 'Kit ID'
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 'Component list'
    put:
      tags:
        - Kits
      summary: 'Update component'
      operationId: d728f5de2bdb00c7f38edb0b8db8d8e7
      parameters:
        -
          name: id
          in: query
          description: 'Component ID'
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Component updated'
    post:
      tags:
        - Kits
      summary: 'Add component to kit'
      operationId: 58da7cb380f7d998519b186ce7f13c2e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Component added'
    delete:
      tags:
        - Kits
      summary: 'Remove component from kit'
      operationId: cf2a308d61dbff161e453f93b2c3ab9f
      parameters:
        -
          name: id
          in: query
          description: 'Component ID'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Component removed'
  /php/api_locations.php:
    get:
      tags:
        - Locations
      summary: 'List locations'
      operationId: 5c855808919414a52edd10ae8eb63694
      parameters:
        -
          name: almacen_id
          in: query
          description: 'Warehouse ID'
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 'Location list'
    put:
      tags:
        - Locations
      summary: 'Update a location'
      operationId: 4c981dd0eacc125bca2c58fc45bcb12a
      parameters:
        -
          name: id
          in: query
          description: 'Location ID'
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Location updated'
    post:
      tags:
        - Locations
      summary: 'Create a location'
      operationId: 3ec250dfea4fd0aa0c5f72fc8459b0bf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Location created'
    delete:
      tags:
        - Locations
      summary: 'Delete a location'
      operationId: 6aa38eb1d6570fce5891c275fb55c814
      parameters:
        -
          name: id
          in: query
          description: 'Location ID'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Location deleted'
  /php/api_logs.php:
    get:
      tags:
        - Logs
      summary: 'Get system logs'
      operationId: 710cb251d63d007736c0015c64e107bc
      parameters:
        -
          name: page
          in: query
          description: 'Page number'
          required: false
          schema:
            type: integer
        -
          name: limit
          in: query
          description: 'Items per page'
          required: false
          schema:
            type: integer
        -
          name: search
          in: query
          description: 'Search query'
          required: false
          schema:
            type: string
        -
          name: dateFrom
          in: query
          description: 'Date from'
          required: false
          schema:
            type: string
        -
          name: dateTo
          in: query
          description: 'Date to'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 'Logs data'
    post:
      tags:
        - Logs
      summary: 'Log inactivity logout'
      operationId: fa076d31ea463ddba799e94361f80f76
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                action:
                  type: string
                  example: log_inactivity_logout
                minutes:
                  type: integer
                  example: 30
              type: object
      responses:
        '200':
          description: 'Log created successfully'
  /php/api_notes.php:
    get:
      tags:
        - Notes
      summary: 'List or get notes'
      operationId: a4bcdef5108aeb909cca9b3a9168df6b
      parameters:
        -
          name: id
          in: query
          description: 'Note ID'
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 'Note list or detail'
    put:
      tags:
        - Notes
      summary: 'Update a note'
      operationId: 47534fcce41daa7f2707fd451f1af982
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - id
              properties:
                id:
                  description: 'Note ID'
                  type: integer
                  example: 1
                titulo:
                  type: string
                  example: 'Nota actualizada'
                descripcion:
                  type: string
                  example: 'Nueva descripción'
                estado:
                  type: string
                  enum: [pendiente, en_progreso, completado]
                  example: en_progreso
                prioridad:
                  type: string
                  enum: [baja, media, alta]
                  example: media
              type: object
            example:
              id: 1
              estado: en_progreso
              prioridad: media
      responses:
        '200':
          description: 'Note updated'
    post:
      tags:
        - Notes
      summary: 'Create a note'
      operationId: cf5679df7165ed632c90613a2e87e781
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - titulo
                - estado
              properties:
                titulo:
                  description: 'Note title'
                  type: string
                  example: 'Revisar inventario'
                descripcion:
                  description: Description
                  type: string
                  example: 'Verificar stock de productos populares'
                estado:
                  description: Status
                  type: string
                  enum: [pendiente, en_progreso, completado]
                  example: pendiente
                prioridad:
                  description: Priority
                  type: string
                  enum: [baja, media, alta]
                  example: alta
                fecha_vencimiento:
                  description: 'Due date'
                  type: string
                  format: date
                  example: '2026-02-15'
                cliente_id:
                  description: 'Related client ID'
                  type: integer
                  example: 1
                  nullable: true
                cliente_nombre:
                  description: 'Client name'
                  type: string
                  example: 'Juan Pérez'
                  nullable: true
              type: object
            example:
              titulo: 'Revisar inventario'
              descripcion: 'Verificar stock de productos populares'
              estado: pendiente
              prioridad: alta
              fecha_vencimiento: '2026-02-15'
      responses:
        '200':
          description: 'Note created'
    delete:
      tags:
        - Notes
      summary: 'Delete a note'
      operationId: a3e49c783afe2c7a2b0b5657033bfb96
      parameters:
        -
          name: id
          in: query
          description: 'Note ID'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Note deleted'
  /php/api_orders.php:
    get:
      tags:
        - Orders
      summary: 'List orders or get details'
      operationId: b23885e0561b7fd0f6742239033538cf
      parameters:
        -
          name: id
          in: query
          description: 'Order ID'
          required: false
          schema:
            type: integer
        -
          name: action
          in: query
          description: "Action 'get_products'"
          required: false
          schema:
            type: string
        -
          name: order_id
          in: query
          description: 'Order ID for products'
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 'Order list or details'
    put:
      tags:
        - Orders
      summary: 'Update an order'
      operationId: bbd673fc6ab97f929101f684a940a1f0
      parameters:
        -
          name: id
          in: query
          description: 'Order ID'
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Order updated'
    post:
      tags:
        - Orders
      summary: 'Create a new order'
      operationId: e29ace0e9d86618e4033f0d33ab2231a
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - cliente_id
                - direccion_envio
                - products
              properties:
                cliente_id:
                  description: 'Client ID'
                  type: integer
                  example: 1
                direccion_envio:
                  description: 'Shipping address'
                  type: string
                  example: 'Av. Principal #123, Caracas'
                notas_envio:
                  description: 'Shipping notes'
                  type: string
                  example: 'Entregar en horario de oficina'
                estado_pago:
                  description: 'Payment status'
                  type: string
                  enum: [pagado, 'no pagado']
                  example: pagado
                estado_envio:
                  description: 'Shipping status'
                  type: string
                  enum: [pendiente, enviado, entregado]
                  example: pendiente
                fecha_creacion:
                  description: 'Order date'
                  type: string
                  format: datetime
                  example: '2026-02-07 10:30:00'
                products:
                  description: 'List of products in the order'
                  type: array
                  items: { properties: { producto_id: { description: 'Product ID', type: integer, example: 5 }, cantidad: { description: Quantity, type: integer, example: 2 }, precio_unitario: { description: 'Unit price', type: number, format: float, example: 25.5 } }, type: object }
              type: object
            example:
              cliente_id: 1
              direccion_envio: 'Av. Principal #123, Caracas'
              notas_envio: 'Entregar en horario de oficina'
              estado_pago: pagado
              estado_envio: pendiente
              fecha_creacion: '2026-02-07 10:30:00'
              products:
                -
                  producto_id: 5
                  cantidad: 2
                  precio_unitario: 25.5
                -
                  producto_id: 12
                  cantidad: 1
                  precio_unitario: 100
      responses:
        '200':
          description: 'Order created'
    delete:
      tags:
        - Orders
      summary: 'Delete an order'
      operationId: ecd6dc0b008c1479fe25aa614701e5aa
      parameters:
        -
          name: id
          in: query
          description: 'Order ID'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Order deleted'
  /api_products.php:
    get:
      tags:
        - Products
      summary: 'List products'
      operationId: 49254378cf83bc42313735c7ef9fb82c
      parameters:
        -
          name: search
          in: query
          description: 'Search term'
          required: false
          schema:
            type: string
        -
          name: page
          in: query
          description: 'Page number'
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 'Successful operation'
          content:
            application/json:
              schema:
                properties:
                  success: { type: boolean }
                  products: { type: array, items: { type: object } }
                  pagination: { type: object }
                type: object
    put:
      tags:
        - Products
      summary: 'Update an existing product'
      operationId: 1efb843c8683102e91096de0c46c4e7b
      parameters:
        -
          name: id
          in: query
          description: 'Product ID'
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                nombre:
                  type: string
                  example: 'Camiseta Actualizada'
                descripcion:
                  type: string
                  example: 'Nueva descripción'
                precio:
                  type: number
                  example: 29.99
                min_stock:
                  type: integer
                  example: 15
                estado:
                  type: string
                  example: activo
              type: object
            example:
              nombre: 'Camiseta Actualizada'
              precio: 29.99
              min_stock: 15
      responses:
        '200':
          description: 'Product updated'
    post:
      tags:
        - Products
      summary: 'Create a new product'
      operationId: fbf5b611cbcad8825ca652656debe303
      requestBody:
        description: 'Product data'
        required: true
        content:
          application/json:
            schema:
              required:
                - nombre
                - sku
                - precio
              properties:
                sku:
                  description: 'Unique product code'
                  type: string
                  example: PROD-001
                nombre:
                  description: 'Product name'
                  type: string
                  example: 'Camiseta Negra M'
                descripcion:
                  description: Description
                  type: string
                  example: 'Camiseta de algodón 100%'
                precio:
                  description: 'Sale price'
                  type: number
                  format: float
                  example: 25.99
                costo_promedio:
                  description: 'Average cost'
                  type: number
                  format: float
                  example: 12.5
                stock:
