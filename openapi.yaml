openapi: 3.0.0
info:
  title: 'BuzzDM API'
  description: 'API documentation for BuzzDM System'
  version: 1.0.0
servers:
  -
    url: 'http://localhost/BuzzDM'
    description: 'Local Development Server'
paths:
  /php/api_auth.php:
    post:
      tags:
        - Auth
      summary: 'Authentication Actions'
      description: "Login, Logout, Forgot Password, Reset Password via 'action' param"
      operationId: 25fece8acb463af16d2a9159879e81f8
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [login, logout, forgot_password, reset_password]
                email:
                  description: 'For login/forgot'
                  type: string
                password:
                  description: 'For login/reset'
                  type: string
                confirmPassword:
                  description: 'For reset'
                  type: string
                token:
                  description: 'For reset'
                  type: string
              type: object
      responses:
        '200':
          description: 'Action result'
  /php/api_backups.php:
    get:
      tags:
        - Backups
      summary: 'List backups'
      operationId: 167c48e6290c4b580657d2af59e8776a
      responses:
        '200':
          description: 'Backup list'
    delete:
      tags:
        - Backups
      summary: 'Delete backup'
      operationId: 73b53df78ca0ad0bbb626b4c995a1de3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                id:
                  type: integer
              type: object
      responses:
        '200':
          description: 'Backup deleted'
  '/php/api_backups.php?action=create':
    post:
      tags:
        - Backups
      summary: 'Create backup'
      operationId: e410090d7e85c2ed394a0cf634c4eeb6
      responses:
        '200':
          description: 'Backup created'
  '/php/api_backups.php?action=restore':
    post:
      tags:
        - Backups
      summary: 'Restore backup'
      operationId: f1c2af3cce6045b454553967ee73d885
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                id:
                  type: integer
              type: object
      responses:
        '200':
          description: 'Backup restored'
  '/php/api_backups.php?action=download':
    get:
      tags:
        - Backups
      summary: 'Download backup'
      operationId: b6df29e8c103e09c72237bd8ddd1ee53
      parameters:
        -
          name: id
          in: query
          description: 'Backup ID'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'File download'
          content:
            application/octet-stream: {  }
  '/php/api_backups.php?action=status':
    get:
